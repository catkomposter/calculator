<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Калькулятор рассрочки</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
body{
  background:#3a1f12;
  font-family:'Lato',sans-serif;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  margin:0;
  overflow:hidden;
  height:100vh;
}

.calculator{
  background:#6b3e26;
  padding:25px;
  width:430px;
  color:white;
  border-radius:10px;
  box-sizing:border-box;
  transform: scale(2.2) translateY(-20px);
  transform-origin: top center;
}

.row{
  display:flex;
  gap:15px;
}
.row .input-box{
  flex:1;
  white-space:nowrap;
}
.input-box,.result-box{
  background:white;
  border-radius:6px;
  padding:10px;
  margin-bottom:15px;
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
}
.input-box label,.result-title{
  font-weight:bold;
  font-size:14px;
  color:black;
  text-align:center;
  white-space:nowrap;
}
.line{
  height:2px;
  background:#ccc;
  margin:6px 0;
}
.input-box input,
.input-box select{
  border:none;
  font-size:18px;
  height:40px;
  padding:6px;
  width:100%;
  box-sizing:border-box;
  background:white;
}
.slider{
  margin-top:6px;
}
button{
  width:100%;
  padding:10px;
  background:linear-gradient(to bottom,#e8c75a,#d9a323,#a66b00);
  color:white;
  font-weight:700;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}
button:hover{
  background:linear-gradient(to bottom,#f0d870,#e8c75a,#c99d21);
}
.result-container{
  display:flex;
  gap:15px;
  margin-bottom:15px;
}
.result-box{
  flex:1;
  align-items:center;
}
.result-value{
  font-weight:bold;
  font-size:18px;
  color:black;
}
.text-header{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:5px;
  font-weight:bold;
  color:white;
  white-space: nowrap;
}
.big-text{
  background:white;
  border-radius:6px;
  padding:15px;
  color:black;
  min-height:90px;
  white-space:pre-line;
}
.share-btn{
  margin-top:10px;
}
.copy-btn{
  margin-top:10px;
  padding:6px 10px;
  font-size:13px;
}
</style>
</head>
<body>
<div class="calculator">
<h2>Калькулятор рассрочки</h2>

<div class="row">
  <div class="input-box">
    <label>Цена товара</label>
    <div class="line"></div>
    <input type="text" id="price" placeholder="100 000" oninput="formatInput(this)">
  </div>

  <div class="input-box">
    <label>Первоначальный взнос</label>
    <div class="line"></div>
    <input type="text" id="vznos" placeholder="20 000" oninput="formatInput(this)">
  </div>
</div>

<div class="input-box">
  <label>Наценка (%)</label>
  <div class="line"></div>
  <input type="text" id="naprice" value="20" oninput="updateSliderAndFormat(this)">
  <input type="range" min="0" max="100" value="20" class="slider" id="markupSlider">
</div>

<div class="input-box">
  <label>Срок рассрочки</label>
  <div class="line"></div>
  <select id="month" onchange="calculate()">
    <option value="3">3 мес.</option>
    <option value="4">4 мес.</option>
    <option value="5">5 мес.</option>
    <option value="6" selected>6 мес.</option>
    <option value="7">7 мес.</option>
    <option value="8">8 мес.</option>
    <option value="9">9 мес.</option>
    <option value="10">10 мес.</option>
    <option value="11">11 мес.</option>
    <option value="12">12 мес.</option>
  </select>
</div>

<!-- Общая стоимость сверху -->
<div class="result-box" style="margin-bottom:15px;">
  <div class="result-title">Общая стоимость</div>
  <div class="line"></div>
  <div class="result-value" id="totalCost"></div>
</div>

<!-- Ряд с остальными результатами -->
<div class="result-container">
  <div class="result-box">
    <div class="result-title">Ежемесячный платеж</div>
    <div class="line"></div>
    <div class="result-value" id="monthlyPayment"></div>
  </div>

  <div class="result-box">
    <div class="result-title">Торговая наценка</div>
    <div class="line"></div>
    <div class="result-value" id="markupAmount"></div>
  </div>
</div>

<div class="text-header">Текст для отправки</div>
<div class="big-text" id="finalText"></div>

<button class="share-btn" onclick="shareText()">Отправить</button>
<button class="copy-btn" onclick="copyText()">Копировать</button>

</div>

<script>
function formatNumber(num){
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
}

function formatInput(input){
  let value = input.value.replace(/\s/g,'').replace(/\D/g,'');
  if(value===""){ input.value=""; return; }
  input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g," ");
  calculate();
}

let slider=document.getElementById("markupSlider");
let input=document.getElementById("naprice");

slider.oninput=function(){
  input.value = this.value + "%";
  calculate();
}

function updateSliderAndFormat(inp){
  let val = inp.value.replace(/\D/g,'');
  val = Math.min(Math.max(val,0),100);
  inp.value = val + "%";
  slider.value = val;
  calculate();
}

function calculate(){
  let price = Number(document.getElementById("price").value.replace(/\s/g,''));
  let vznos = Number(document.getElementById("vznos").value.replace(/\s/g,''));
  let naprice = Number(document.getElementById("naprice").value.replace(/\D/g,''));
  let month = Number(document.getElementById("month").value);

  if(!price || !month) return;
  if(vznos > price) vznos = price;

  let markup = price * naprice/100;
  let total = price + markup - vznos;
  let monthly = Math.round(total/month);
  let totalCostValue = price + markup;

  document.getElementById("monthlyPayment").innerHTML = formatNumber(monthly) + " ₽";
  document.getElementById("markupAmount").innerHTML = formatNumber(Math.round(markup)) + " ₽";
  document.getElementById("totalCost").innerHTML = formatNumber(Math.round(totalCostValue)) + " ₽";

  let text =
  "Общая стоимость товара: "+formatNumber(Math.round(totalCostValue))+" ₽\n"+
  "Первоначальный взнос: "+formatNumber(vznos)+" ₽\n"+
  "Ежемесячный платеж: "+formatNumber(monthly)+" ₽\n"+
  "Срок рассрочки: "+month+" мес.";

  document.getElementById("finalText").innerText = text;
}

function copyText(){
  let text = document.getElementById("finalText").innerText;
  if(text.trim() === "") return alert("Сначала рассчитайте рассрочку!");
  navigator.clipboard.writeText(text);
}

function shareText(){
  let text=document.getElementById("finalText").innerText;
  if(navigator.share){
    navigator.share({title:"Рассрочка",text:text});
  }else{
    navigator.clipboard.writeText(text);
    alert("Текст скопирован");
  }
}

document.getElementById("price").addEventListener("input", calculate);
document.getElementById("vznos").addEventListener("input", calculate);
document.getElementById("naprice").addEventListener("input", calculate);
document.getElementById("month").addEventListener("change", calculate);
window.addEventListener("load", calculate);
</script>
</body>
</html>
